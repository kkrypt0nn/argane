apiVersion: v1
kind: Pod
spec:
  containers:
    - name: host_probes
      livenessProbe:
        httpGet:
          host: example.com
---
apiVersion: v1
kind: Pod
spec:
  containers:
    - name: host_probes
      readinessProbe:
        tcpSocket:
          host: example.com
---
apiVersion: v1
kind: Pod
spec:
  containers:
    - name: host_probes
      startupProbe:
        httpGet:
          host: example.com
---
apiVersion: v1
kind: Pod
spec:
  containers:
    - name: host_probes
      lifecycle:
        postStart:
          httpGet:
            host: example.com
---
apiVersion: v1
kind: Pod
spec:
  containers:
    - name: host_probes
      lifecycle:
        preStop:
          tcpSocket:
            host: example.com
---
apiVersion: v1
kind: Pod
spec:
  initContainers:
    - name: host_probes
      livenessProbe:
        httpGet:
          host: example.com
