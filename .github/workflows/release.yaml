name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must start with v)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release new version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate version
        run: |
          [[ "${VERSION}" == v* ]] || (echo "Version must start with v" && exit 1)
        env:
          VERSION: ${{ inputs.version }}

      - name: Extract version without v
        run: echo "VERSION_NO_V=${VERSION#v}" >> $GITHUB_ENV
        env:
          VERSION: ${{ inputs.version }}

      - name: Update latest-version and generate docs
        run: |
          echo "${VERSION_NO_V}" > ./www/public/latest-version

          make gendoc

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add www/public/latest-version
            git add www/src/content/docs/commands/
            git add www/src/content/docs/rules/
            git commit -m "chore: Update latest version to ${VERSION_NO_V}"
            git push origin HEAD
          fi
        env:
          VERSION: ${{ inputs.version }}

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.4

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            VERSION=${{ env.VERSION_NO_V }}
          tags: |
            kkrypt0nn/argane:latest
            kkrypt0nn/argane:${{ env.VERSION_NO_V }}
            ghcr.io/kkrypt0nn/argane:latest
            ghcr.io/kkrypt0nn/argane:${{ env.VERSION_NO_V }}
