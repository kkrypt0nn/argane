name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must start with v)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release new version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate version
        run: |
          [[ "${VERSION}" == v* ]] || (echo "Version must start with v" && exit 1)
        env:
          VERSION: ${{ inputs.version }}

      - name: Extract version without v
        run: echo "VERSION_NO_V=${VERSION#v}" >> $GITHUB_ENV
        env:
          VERSION: ${{ inputs.version }}

      - name: Update latest-version and generate docs
        run: |
          echo "${VERSION_NO_V}" > ./www/public/latest-version

          make gendoc

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add www/public/latest-version
            git add www/src/content/docs/commands/
            git add www/src/content/docs/rules/
            git commit -m "chore: Update latest version to ${VERSION_NO_V}"
            git push origin HEAD
          fi
        env:
          VERSION: ${{ inputs.version }}

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            VERSION=${{ env.VERSION_NO_V }}
          tags: |
            kkrypt0nn/argane:latest
            kkrypt0nn/argane:${{ env.VERSION_NO_V }}
            ghcr.io/kkrypt0nn/argane:latest
            ghcr.io/kkrypt0nn/argane:${{ env.VERSION_NO_V }}
