name: Deploy Website

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    uses: kkrypt0nn/actions/.github/workflows/deploy_website.yaml@764909eeff7c880e26da91d6f31a208fdb45d57b # v0.2.0
    with:
      working-directory: ./www
